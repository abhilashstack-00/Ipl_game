<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strategy Arena</title>
    <meta name="description" content="A two-player IPL strategy game: auction teams, then score from real match results." />
    <!-- Pick the theme before anything paints, so there is no flash of the wrong theme. -->
    <script>
      (function () {
        var theme
        try { theme = localStorage.getItem('arena_theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23101312'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23F2A81D' stroke-width='3'/><path d='M10 16h12' stroke='%23F2A81D' stroke-width='2'/></svg>" />
    <style>
      html[data-theme='light'] { background: #F3EFE4; color: #1C1B19; }
      html[data-theme='dark'] { background: #101312; color: #EDEAE2; }
      .boot { min-height: 100vh; display: grid; place-items: center; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; opacity: .7; }
    </style>
    <script type="module" crossorigin src="./assets/index-Kxwb5yEf.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DlTG-Tkr.css">
  </head>

    <div id="root">
      <div class="boot">Loading Strategy Arena…</div>
    </div>
    <noscript>Strategy Arena needs JavaScript turned on.</noscript>
  </body>
</html>
